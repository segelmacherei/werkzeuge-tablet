name: Windows-Programm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version veröffentlichen (z.B. 1.0.1) – leer = nur bauen und testen'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version festlegen
        id: v
        env:
          EINGABE: ${{ github.event.inputs.version }}
        run: |
          V=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "$EINGABE" ]]; then V="${EINGABE#v}"; fi
          if [[ -n "$V" ]]; then npm version "$V" --no-git-tag-version --allow-same-version; echo "tag=v$V" >> "$GITHUB_OUTPUT"; fi
      - run: npm install
      - name: Installer bauen
        run: npx electron-builder --win --x64 --publish never
      - name: Rauchtest
        run: |
          npm install --no-save playwright@1
          node test/smoke.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Segelmacherei-Werkzeuge
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
            desktop/test/*.png
      - name: Veröffentlichen (für automatische Updates)
        if: steps.v.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.exe dist/*.blockmap dist/latest.yml --target "$GITHUB_SHA" \
            --title "Segelmacherei Werkzeuge ${TAG#v}" \
            --notes "Windows-Programm der Segelmacherei-Werkzeuge. Installieren: Segelmacherei-Werkzeuge-Setup.exe herunterladen und ausführen. Installierte Programme aktualisieren sich selbst."
