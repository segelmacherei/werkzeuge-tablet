name: Windows-Programm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version aus dem Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm install
      - name: Installer bauen
        run: npx electron-builder --win --x64 --publish never
      - name: Rauchtest
        run: |
          npm install --no-save playwright@1
          node test/smoke.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Segelmacherei-Werkzeuge
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
            desktop/test/*.png
      - name: Veröffentlichen (für automatische Updates)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.blockmap dist/latest.yml \
            --title "Segelmacherei Werkzeuge ${GITHUB_REF_NAME#v}" \
            --notes "Windows-Programm der Segelmacherei-Werkzeuge. Installieren: Segelmacherei-Werkzeuge-Setup.exe herunterladen und ausführen. Installierte Programme aktualisieren sich selbst."
