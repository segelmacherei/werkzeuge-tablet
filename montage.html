<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Montage Sonnensegel</title>
<style>
:root{--ink:#14181f;--mut:#5b6472;--line:#dde1e7;--bg:#f4f6f9;--card:#fff;--a:#d0281e;--acc:#0b6b4b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:#14181f;color:#fff;padding:14px 16px calc(14px) 16px}
header .f{font-size:13px;opacity:.8}
header h1{font-size:20px;margin:2px 0 0;font-weight:700}
main{max-width:860px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tabs button{font:inherit;font-size:15px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#cv{width:100%;height:56vh;max-height:520px;min-height:300px;display:block;border-radius:10px;background:#eef2f6;touch-action:none}
.vb{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.vb button{font:inherit;font-size:14px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
.hint{font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14.5px}td.sp{font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--mut);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ea{color:var(--a);font-weight:700}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:2.5px solid var(--a);vertical-align:-1px;margin-right:4px}
ol{margin:6px 0 0;padding-left:22px}ol li{margin:6px 0}
h2{font-size:17px;margin:0 0 8px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.err{padding:30px 16px;text-align:center;color:var(--mut)}
footer{font-size:13px;color:var(--mut);text-align:center;margin-top:16px}
footer a{color:var(--acc)}
</style>
</head>
<body>
<header><div class="f" id="firm">Montage Sonnensegel</div><h1 id="titel">Montage</h1></header>
<main id="main"><div class="err">Lade …</div></main>
<script>
/* Montage-Ansicht für Monteure / Spielplatzbauer.
   Alle Angaben stehen im QR-Code selbst (im #-Teil der Adresse) – sie werden nicht an einen Server geschickt und nirgends gespeichert. */
(function(){
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LET='ABCDEFGHIJKLMNOP',mm=v=>Math.round(v*1000).toLocaleString('de-CH');
let D=null;
try{const h=location.hash.replace(/^#/,'');let m=h.match(/(?:^|&)m=([^&]+)/);
  if(m){/* Format 2: Kopf!Segel!Segel!H… */const T=m[1].split('!'),dec=s=>{try{return decodeURIComponent(s||'')}catch(e){return s||''}},K=T[0].split('~');
    const SL=(K[7]||'').split('|').map(dec).filter(Boolean);
    D={p:dec(K[1]),f:dec(K[2]),t:dec(K[3]),m:dec(K[4]),d:K[5]||'',a:+K[6]||0,s:[],h:[]};
    T.slice(1).forEach(x=>{if(x[0]==='H'){D.h=x.slice(1).split('_').map(o=>{const n=o.split('.').map(Number);const p=[];for(let i=1;i+1<n.length;i+=2)p.push([n[i],n[i+1]]);return {z:n[0],p}});return}
      const f=x.split('~');D.s.push({n:dec(f[0]),c:f[1]?'#'+f[1]:'',tu:dec(f[2]),tf:dec(f[3]),ty:f[4],vr:+f[5],kg:+f[6],b:+f[7],w:+f[9]>0?+f[9]/1000:1.42,e:(f[8]||'').split('_').filter(Boolean).map(q=>{const n=q.split('.').map(Number);return [n[0],n[1],n[2],n[3]||0,n[4]||0,n[5]>0?SL[n[5]-1]||'':'']})})})}
  else{m=h.match(/(?:^|&)d=([^&]+)/);if(!m)throw 0;
  let b=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  D=JSON.parse(new TextDecoder().decode(u))}}catch(e){D=null}
if(!D||!Array.isArray(D.s)||!D.s.length){$('#main').innerHTML='<div class="err">Dieser Link enthält keine Montagedaten.<br>Bitte den QR-Code auf der Segel-Etikette nochmals scannen.</div>';return}
$('#firm').textContent=D.f||'Montage Sonnensegel';$('#titel').textContent=D.p||'Montage';document.title='Montage – '+(D.p||'Sonnensegel');
let cur=Math.min(Math.max(0,+D.a||0),D.s.length-1);
/* Daten: Punkte [x,y,h,gz,typ(0 Stütze / 1 Wand),Spanner] in cm */
const S=D.s.map(s=>({...s,P:(s.e||[]).map(q=>({x:q[0]/100,y:q[1]/100,h:q[2]/100,gz:(q[3]||0)/100,w:q[4]===1,sp:q[5]||''}))}));
const H=(D.h||[]).map(o=>({pts:o.p.map(q=>({x:q[0]/100,y:q[1]/100})),h:o.z/100}));
$('#main').innerHTML=`${S.length>1?`<div class="tabs" id="tabs">${S.map((s,i)=>`<button type="button" data-i="${i}"><span class="sw" style="background:${esc(s.c||'#e8913a')}"></span>${esc(s.n||('Segel '+(i+1)))}</button>`).join('')}</div>`:''}
 <div class="card"><canvas id="cv"></canvas><div class="vb"><button type="button" data-v="iso">Schräg</button><button type="button" data-v="top">Von oben</button><button type="button" data-v="fit">Einpassen</button><button type="button" id="bN" aria-pressed="true">Nähte ✓</button></div>
 <div class="hint" style="margin-top:6px">Mit dem Finger drehen, mit zwei Fingern zoomen. <span class="dot"></span><b class="ea">Ecke A</b> ist am Segel rot markiert.</div></div>
 <div class="card" id="info"></div>
 <div class="card"><h2>So montieren</h2><ol id="steps"></ol></div>
 <div class="card" id="spannen"><h2>Wichtig beim Spannen</h2>
  <svg viewBox="0 0 340 230" role="img" aria-label="Segelecke: das schwarze Randseil trägt den Zug, das weisse Gurtband hält das Segel nur in Position" style="width:100%;max-width:460px;display:block;margin:4px auto 8px">
   <path d="M30 215 Q125 180 168 118 L182 118 Q225 180 320 215 Q175 190 30 215Z" fill="#cfe3c4"/>
   <path d="M175 120 L175 68" stroke="#6b7280" stroke-width="13" stroke-linecap="round"/>
   <path d="M175 120 L175 68" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
   <path d="M30 215 Q125 180 168 118 L172 64" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M320 215 Q225 180 182 118 L178 64" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
   <circle cx="175" cy="56" r="10" fill="none" stroke="#555" stroke-width="4"/>
   <rect x="170" y="8" width="10" height="38" rx="3" fill="#8a929c"/>
   <text x="160" y="30" text-anchor="end" font-size="13" fill="#111" font-family="system-ui">Spanner</text>
   <text x="8" y="100" font-size="13" font-weight="700" fill="#111" font-family="system-ui">Schwarzes Randseil</text>
   <text x="8" y="116" font-size="12" fill="#111" font-family="system-ui">(Dyneema) trägt den Zug</text>
   <path d="M112 122 L140 144" stroke="#111" stroke-width="1"/>
   <text x="204" y="74" font-size="13" font-weight="700" fill="#374151" font-family="system-ui">Weisses Gurtband</text>
   <text x="204" y="90" font-size="12" fill="#374151" font-family="system-ui">nur führen, wenig Zug</text>
   <path d="M202 84 L184 96" stroke="#374151" stroke-width="1"/>
  </svg>
  <ul style="margin:0;padding-left:20px">
   <li>Das <b>schwarze Randseil (Dyneema)</b> spannt das Segel – der ganze Zug läuft über das Seil zum Spanner.</li>
   <li>Das <b>weisse Gurtband</b> hält das Segel nur an seinem Platz, damit es nicht wandert. Es darf <b>nicht stark gespannt</b> sein.</li>
  </ul>
  <div style="display:flex;gap:10px;margin:12px 0 6px">
   <svg viewBox="0 0 150 100" role="img" aria-label="Richtig: Segel glatt" style="flex:1;max-width:220px"><path d="M10 90 Q75 55 75 10 Q75 55 140 90 Q75 70 10 90Z" fill="#cfe3c4" stroke="#111" stroke-width="3"/><text x="75" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#0b6b4b" font-family="system-ui">✓ faltenfrei</text></svg>
   <svg viewBox="0 0 150 100" role="img" aria-label="Falsch: Falten von der Ecke her, weil das Gurtband zu viel Zug hat" style="flex:1;max-width:220px"><path d="M10 90 Q75 55 75 10 Q75 55 140 90 Q75 70 10 90Z" fill="#cfe3c4" stroke="#111" stroke-width="3"/><path d="M75 22 L52 70 M75 22 L65 74 M75 22 L86 74 M75 22 L98 70" stroke="#7a8a70" stroke-width="1.6"/><text x="75" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#d0281e" font-family="system-ui">✗ Falten ab der Ecke</text></svg>
  </div>
  <p style="margin:6px 0 4px"><b>Falten ab der Ecke?</b> Dann zieht das Gurtband zu stark:</p>
  <ol style="margin:0">
   <li>Segel <b>entspannen</b> (Spanner lösen).</li>
   <li>Das <b>schwarze Randseil trimmen</b> (nachziehen), bis es den Zug übernimmt und das Gurtband locker ist.</li>
   <li>Segel <b>nochmals aufspannen</b>.</li>
  </ol>
  <p style="margin:10px 0 0;padding:8px 10px;background:#fff4e5;border-radius:8px;font-size:15px">Das Segel muss <b>faltenfrei</b> sein. Nur dann hält es auch bei Sturm. Wir stellen die Segel in der Werkstatt ein – den letzten Trimm sieht man aber erst beim Spannen vor Ort.</p>
 </div>
 <footer id="ft"></footer>`;
const cv=$('#cv'),ctx=cv.getContext('2d');
let yaw=-0.6,pitch=0.75,zoom=1,panX=0,panY=0;
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y,a.h-b.h)}
function info(){const s=S[cur],n=s.P.length,vr=s.vr>=0?s.vr:-1,kg=s.kg>=0?s.kg:-1;
  const rows=s.P.map((p,i)=>`<tr><td class="${i===0?'ea':''}">${i===0?'<span class="dot"></span>':''}${LET[i]}</td><td>${p.w?'Wand':'Stütze'}</td><td class="n">${mm(p.h-p.gz)}</td><td class="sp">${esc(p.sp||'–')}</td><td>${i===vr?'<b>Vorroller</b>':i===kg?'Kugellager':''}${i===0?(i===vr||i===kg?' · ':'')+'<span class="ea">rot markiert</span>':''}</td></tr>`).join('');
  const kan=s.P.map((p,i)=>`${LET[i]}–${LET[(i+1)%n]} <b>${mm(dist(p,s.P[(i+1)%n]))}</b>`).join(' · ');
  $('#info').innerHTML=`<h2><span class="sw" style="background:${esc(s.c||'#e8913a')}"></span>${esc(s.n||'Segel')}</h2>
   <div class="hint" style="margin:-4px 0 8px">${esc([s.tu,s.tf,s.ty==='r'?'Rollsegel':'Saisonsegel'].filter(Boolean).join(' · '))}</div>
   <table><tr><th>Ecke</th><th>Befestigung</th><th style="text-align:right">Höhe [mm]</th><th>Spanner</th><th></th></tr>${rows}</table>
   <div class="hint" style="margin-top:8px">Abstand der Befestigungspunkte [mm]: ${kan}</div>`;
  const st=[`Befestigungspunkte prüfen: Höhen und Abstände wie oben (± 2 cm). Weicht etwas mehr ab, bitte zuerst anrufen.`,
    `Segel auslegen: die <span class="ea">rot markierte Ecke</span> ist <b>Ecke A</b> und gehört an Punkt A. Danach der Reihe nach ${s.P.map((_,i)=>LET[i]).join(' → ')}.`,
    `Spanner ganz öffnen und alle Ecken einhängen, noch nicht spannen.`,
    `Gleichmässig über Kreuz spannen, bis das Segel straff und <b>faltenfrei</b> ist. Der Zug muss über das <b>schwarze Randseil</b> laufen, nicht über das weisse Gurtband (siehe unten).`,
    `Gibt es Falten ab einer Ecke: entspannen, schwarzes Randseil trimmen, nochmals aufspannen. Danach Spanner sichern (Kontermutter / Sicherung).`];
  if(s.ty==='r'&&vr>=0)st.splice(2,0,`Rollsegel: Vorroller an Ecke <b>${LET[vr]}</b>${kg>=0?', Kugellager an Ecke <b>'+LET[kg]+'</b>':''}. Die Mittelkante ${LET[vr]}–${kg>=0?LET[kg]:'…'} braucht am meisten Zug; die beiden anderen Ecken werden zum Aufrollen gelöst.`);
  $('#steps').innerHTML=st.map(t=>`<li>${t}</li>`).join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.i===cur))}
/* einfache Orthogonal-Projektion: Drehung um z (yaw), Neigung (pitch) */
function P3(x,y,z){const cy=Math.cos(yaw),sy=Math.sin(yaw);const u=x*cy-y*sy,v=x*sy+y*cy;const cp=Math.cos(pitch),sp=Math.sin(pitch);return {u,w:-(v*cp)-z*sp+0,depth:v*sp-z*cp}}
let fitS=1,fitX=0,fitY=0;
function allPts(){const A=[];S.forEach(s=>s.P.forEach(p=>{A.push([p.x,p.y,p.h],[p.x,p.y,p.gz])}));H.forEach(o=>o.pts.forEach(q=>{A.push([q.x,q.y,0],[q.x,q.y,o.h])}));return A}
function fit(){const r=cv.getBoundingClientRect(),W=r.width,Hh=r.height;const Q=allPts().map(a=>P3(a[0],a[1],a[2]));if(!Q.length)return;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;Q.forEach(q=>{x0=Math.min(x0,q.u);x1=Math.max(x1,q.u);y0=Math.min(y0,q.w);y1=Math.max(y1,q.w)});
  fitS=Math.min((W-150)/Math.max(.5,x1-x0),(Hh-70)/Math.max(.5,y1-y0));fitX=W/2-(x0+x1)/2*fitS-30;fitY=Hh/2-(y0+y1)/2*fitS;zoom=1;panX=0;panY=0}
function scr(x,y,z){const q=P3(x,y,z),s=fitS*zoom,r=cv.getBoundingClientRect();return {x:(q.u*fitS+fitX-r.width/2)*zoom+r.width/2+panX,y:(q.w*fitS+fitY-r.height/2)*zoom+r.height/2+panY,d:q.depth}}
function curve(s){/* Segelrand mit Bogen nach innen (Dip %) */const n=s.P.length,c={x:0,y:0,z:0};s.P.forEach(p=>{c.x+=p.x/n;c.y+=p.y/n;c.z+=p.h/n});const bow=(+s.b||8)/100,out=[];
  for(let i=0;i<n;i++){const a=s.P[i],b=s.P[(i+1)%n],L=Math.hypot(b.x-a.x,b.y-a.y,b.h-a.h),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2,z:(a.h+b.h)/2};
    const dx=c.x-m.x,dy=c.y-m.y,dz=c.z-m.z,dl=Math.hypot(dx,dy,dz)||1,k=L*bow*2;const ctl={x:m.x+dx/dl*k,y:m.y+dy/dl*k,z:m.z+dz/dl*k};
    for(let t=0;t<16;t++){const u=t/16,a1=(1-u)*(1-u),b1=2*u*(1-u),c1=u*u;out.push({x:a1*a.x+b1*ctl.x+c1*b.x,y:a1*a.y+b1*ctl.y+c1*b.y,z:a1*a.h+b1*ctl.z+c1*b.h})}}return out}
/* Nähte wie im Planer: von der Mittelachse aus alle Bahnbreiten (Standard 1420 mm) – Achse: Rollsegel Mittelkante, sonst längste Diagonale, Dreieck Ecke → Mitte längste Kante */
let zeigN=true;
function naehte(s,C){const P=s.P.map(p=>({x:p.x,y:p.y,z:p.h})),n=P.length;if(n<3)return [];const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}),dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,L=a=>Math.hypot(a.x,a.y,a.z),mul=(a,k)=>({x:a.x*k,y:a.y*k,z:a.z*k}),cr=(a,b)=>({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x});
  let A,B;if(s.ty==='r'&&s.vr>=0&&s.kg>=0&&P[s.vr]&&P[s.kg]){A=P[s.vr];B=P[s.kg]}
  else if(n>=4){let bst=null;for(let i=0;i<n;i++)for(let j=i+2;j<n;j++){if(i===0&&j===n-1)continue;const d=L(sub(P[i],P[j]));if(!bst||d>bst.d)bst={i,j,d}}A=P[bst.i];B=P[bst.j]}
  else{let bi=0,bl=-1;for(let i=0;i<3;i++){const l=L(sub(P[i],P[(i+1)%3]));if(l>bl){bl=l;bi=i}}A=P[(bi+2)%3];B=mul({x:P[bi].x+P[(bi+1)%3].x,y:P[bi].y+P[(bi+1)%3].y,z:P[bi].z+P[(bi+1)%3].z},.5)}
  let N={x:0,y:0,z:0};for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n];N.x+=(a.y-b.y)*(a.z+b.z);N.y+=(a.z-b.z)*(a.x+b.x);N.z+=(a.x-b.x)*(a.y+b.y)}N=mul(N,1/(L(N)||1));
  let d=sub(B,A);d=sub(d,mul(N,dot(d,N)));d=mul(d,1/(L(d)||1));const e=cr(N,d),W=s.w||1.42;
  const v=C.map(p=>dot(sub(p,A),e)),mn=Math.min(...v),mx=Math.max(...v),out=[];
  for(let k=Math.ceil(mn/W);k<=Math.floor(mx/W);k++){const lv=k*W,X=[];for(let i=0;i<C.length;i++){const j=(i+1)%C.length,va=v[i],vb=v[j];if((va<lv&&vb>=lv)||(va>=lv&&vb<lv)){const t=(lv-va)/(vb-va);X.push({x:C[i].x+(C[j].x-C[i].x)*t,y:C[i].y+(C[j].y-C[i].y)*t,z:C[i].z+(C[j].z-C[i].z)*t})}}
    X.sort((a,b)=>dot(sub(a,A),d)-dot(sub(b,A),d));for(let i=0;i+1<X.length;i+=2)out.push({k,a:X[i],b:X[i+1]})}
  return out}
function draw(){const dpr=window.devicePixelRatio||1,r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,r.width,r.height);
  /* Boden-Raster 1 m */const A=allPts();let gx0=1e9,gx1=-1e9,gy0=1e9,gy1=-1e9;A.forEach(a=>{gx0=Math.min(gx0,a[0]);gx1=Math.max(gx1,a[0]);gy0=Math.min(gy0,a[1]);gy1=Math.max(gy1,a[1])});
  gx0=Math.floor(gx0)-2;gx1=Math.ceil(gx1)+2;gy0=Math.floor(gy0)-2;gy1=Math.ceil(gy1)+2;ctx.strokeStyle='rgba(20,30,50,.08)';ctx.lineWidth=1;ctx.beginPath();
  for(let x=gx0;x<=gx1;x++){const a=scr(x,gy0,0),b=scr(x,gy1,0);ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}for(let y=gy0;y<=gy1;y++){const a=scr(gx0,y,0),b=scr(gx1,y,0);ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}ctx.stroke();
  /* Nordpfeil */{const a=scr(gx0+0.7,gy1-0.7,0),b=scr(gx0+0.7,gy1+0.3,0);ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.fillStyle='#333';ctx.font='bold 13px system-ui';ctx.fillText('N',b.x+4,b.y)}
  /* Gebäude */H.forEach(o=>{const n=o.pts.length;const F=[];for(let i=0;i<n;i++){const a=o.pts[i],b=o.pts[(i+1)%n];F.push([[a.x,a.y,0],[b.x,b.y,0],[b.x,b.y,o.h],[a.x,a.y,o.h]])}F.push(o.pts.map(q=>[q.x,q.y,o.h]));
